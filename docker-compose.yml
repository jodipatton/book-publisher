name: bedtime-storybook

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsc
      POSTGRES_PASSWORD: bsc_dev
      POSTGRES_DB: bsc
    ports:
      - "5432:5432"
    volumes:
      - bsc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsc -d bsc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bsc_minio
      MINIO_ROOT_PASSWORD: bsc_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bsc_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the storybook-pages bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bsc_minio bsc_minio_dev &&
      (mc mb --ignore-existing local/storybook-pages) &&
      mc anonymous set download local/storybook-pages
      "

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      BSC_DATABASE_URL: postgresql+asyncpg://bsc:bsc_dev@db:5432/bsc
      BSC_REDIS_URL: redis://redis:6379/0
      BSC_S3_ENDPOINT: http://minio:9000
      BSC_S3_ACCESS_KEY: bsc_minio
      BSC_S3_SECRET_KEY: bsc_minio_dev
      BSC_S3_BUCKET: storybook-pages
      BSC_S3_REGION: us-east-1
      BSC_DEV_AUTH_ENABLED: "true"
      BSC_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  bsc_pgdata:
  bsc_minio:
